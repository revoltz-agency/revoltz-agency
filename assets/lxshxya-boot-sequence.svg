<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="t d">
<title id="t">System initialization</title><desc id="d">A restrained animated system log revealing current work and creative direction.</desc>
<defs><linearGradient id="g"><stop stop-color="#89959a"/><stop offset=".5" stop-color="#f0f4f4"/><stop offset="1" stop-color="#68757a"/></linearGradient></defs>
<rect width="1000" height="220" rx="3" fill="#080a0b" stroke="#586368" stroke-opacity=".65"/>
<path d="M0 34H1000" stroke="#68757a" stroke-opacity=".45"/>
<g fill="#aab4b7" font-family="monospace" font-size="10" letter-spacing="2"><text x="24" y="22">SYSTEM / INITIALIZATION LOG</text><text x="976" y="22" text-anchor="end">SESSION 001</text></g>
<g font-family="monospace" font-size="14" fill="#dce3e5">
 <text x="28" y="69" opacity="0">[ OK ]  CORE SYSTEMS ONLINE<animate attributeName="opacity" values="0;1" begin=".2s" dur=".5s" fill="freeze"/></text>
 <text x="28" y="105" opacity="0">[ OK ]  PRODUCT LAB: ACTIVE<animate attributeName="opacity" values="0;1" begin=".9s" dur=".5s" fill="freeze"/></text>
 <text x="28" y="141" opacity="0">[ OK ]  DINETAP / REVOLTZ AI: IN DEVELOPMENT<animate attributeName="opacity" values="0;1" begin="1.6s" dur=".5s" fill="freeze"/></text>
 <text x="28" y="177" opacity="0">[ READY ]  BUILDING WHAT COMES NEXT<span fill="#dce3e5">_</span><animate attributeName="opacity" values="0;1" begin="2.3s" dur=".5s" fill="freeze"/></text>
</g>
<rect x="382" y="162" width="9" height="16" fill="url(#g)"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<path d="M24 195H976" stroke="#aab4b7" opacity=".18"/><path d="M24 195H24" stroke="url(#g)" stroke-width="2"><animate attributeName="d" values="M24 195H24;M24 195H976" begin=".2s" dur="2.6s" fill="freeze"/></path>
</svg>