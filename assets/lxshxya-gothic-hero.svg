<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">LXSHXYA — built in the dark</title><desc id="d">A cinematic monochrome digital editorial cover with oversized typography, fine silver interference lines and restrained moving light.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090b0a"/><stop offset=".55" stop-color="#111614"/><stop offset="1" stop-color="#050606"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".25" stop-color="#87938d"/><stop offset=".5" stop-color="#e7eee9"/><stop offset=".75" stop-color="#56615b"/><stop offset="1" stop-color="#cdd7d1"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#b9c8bf" stop-opacity=".18"/><stop offset="1" stop-color="#b9c8bf" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .7 0 0 0 0 .8 0 0 0 0 .75 0 0 0 .08 0"/></filter>
 <style>
 .micro{font:11px 'Courier New',monospace;letter-spacing:3px;fill:#9aa69f}
 .hair{fill:none;stroke:#c7d2cb;stroke-opacity:.28;stroke-width:1}
 .ribbon{fill:none;stroke:url(#silver);stroke-width:1.4;stroke-linecap:round}
 .title{font:900 102px Arial,sans-serif;letter-spacing:9px;fill:url(#silver)}
 .reveal{animation:reveal 2s cubic-bezier(.2,.7,.2,1) both}
 .scan{animation:scan 9s ease-in-out infinite}
 .float{animation:float 8s ease-in-out infinite}
 .dash{stroke-dasharray:3 13;animation:dash 18s linear infinite}
 @keyframes reveal{from{opacity:0;transform:translateY(18px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
 @keyframes scan{0%,100%{transform:translateX(-160px);opacity:0}20%,75%{opacity:.6}50%{transform:translateX(160px);opacity:.18}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes dash{to{stroke-dashoffset:-256}}
 </style>
</defs>
<rect width="1200" height="470" fill="url(#bg)"/>
<ellipse cx="910" cy="230" rx="310" ry="240" fill="url(#light)" filter="url(#blur)"/>
<path d="M0 22H1200M0 448H1200" stroke="#87948c" stroke-opacity=".25"/>
<g class="micro"><text x="46" y="54">REVOLTZ / PERSONAL ARCHIVE</text><text x="1154" y="54" text-anchor="end">VOL. 001 — 2026</text></g>
<g class="reveal">
 <text class="micro" x="62" y="164">INDEPENDENT BUILDER · AI / SAAS / SYSTEMS</text>
 <text class="title" x="54" y="270">LXSHXYA</text>
 <path d="M64 294H630" stroke="url(#silver)" stroke-width="1.2"/>
 <text x="64" y="337" font-family="Arial,sans-serif" font-size="27" font-weight="300" letter-spacing="7" fill="#dce5df">BUILT IN THE DARK.</text>
 <text class="micro" x="64" y="382">IDEAS → SYSTEMS → PRODUCTS</text>
</g>
<g class="float">
 <path class="hair" d="M730 100C830 160 1020 80 1118 176S1018 337 906 355 770 321 728 390"/>
 <path class="ribbon" d="M744 78C844 145 1025 65 1127 167S1028 351 914 367 780 331 741 410"/>
 <path class="hair dash" d="M770 56C874 131 1038 52 1150 155S1040 373 924 390 794 345 758 427"/>
 <path class="ribbon" d="M815 82C894 157 1010 112 1080 190S1005 315 923 332 826 310 798 370"/>
 <path class="hair" d="M850 65C914 131 1018 126 1051 197S985 286 918 300 851 282 833 331"/>
 <path d="M730 100C830 160 1020 80 1118 176S1018 337 906 355 770 321 728 390" fill="none" stroke="#f4fff8" stroke-opacity=".5" stroke-width="14" filter="url(#blur)"/>
 <path class="ribbon" d="M740 238Q850 190 920 230T1110 236"/>
</g>
<g class="scan"><path d="M850 70V405" stroke="#effff5" stroke-width="42" opacity=".13" filter="url(#blur)"/></g>
<rect width="1200" height="470" filter="url(#grain)" opacity=".28"/>
<g class="micro"><text x="46" y="430">NO NOISE. JUST THE WORK.</text><text x="1154" y="430" text-anchor="end">SYSTEM STATUS: BUILDING</text></g>
</svg>