<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
<title id="t">Abstract chrome cybersigil</title><desc id="d">A dark cinematic field of intricate symmetrical silver linework, drifting particles and animated chrome light.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#171b1b"/><stop offset=".55" stop-color="#090b0c"/><stop offset="1" stop-color="#030405"/></radialGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3d4548"/><stop offset=".18" stop-color="#f4f7f7"/><stop offset=".32" stop-color="#778186"/><stop offset=".48" stop-color="#fff"/><stop offset=".63" stop-color="#687277"/><stop offset=".82" stop-color="#dce1e2"/><stop offset="1" stop-color="#41494d"/></linearGradient>
 <linearGradient id="beam"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
 <pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#cbd2d4" opacity=".5"/></pattern>
 <style>
 .line{fill:none;stroke:url(#chrome);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
 .fine{fill:none;stroke:#b8c1c4;stroke-width:.65;opacity:.42}
 .orbit{transform-origin:600px 205px;animation:turn 48s linear infinite}
 .counter{transform-origin:600px 205px;animation:turn 66s linear infinite reverse}
 .pulse{animation:pulse 6s ease-in-out infinite}
 .spark{animation:blink 3.4s ease-in-out infinite}
 .sweep{animation:sweep 8s ease-in-out infinite}
 .grain{opacity:.12}
 @keyframes turn{to{transform:rotate(360deg)}}
 @keyframes pulse{0%,100%{opacity:.34;transform:scale(.985)}50%{opacity:.8;transform:scale(1.018)}}
 @keyframes blink{0%,100%{opacity:.12}45%{opacity:.85}}
 @keyframes sweep{0%{transform:translateX(-420px);opacity:0}25%{opacity:.35}70%{opacity:.12}100%{transform:translateX(420px);opacity:0}}
 </style>
</defs>
