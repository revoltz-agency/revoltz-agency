<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">LXSHXYA — chromeheart cybersigil</title>
<desc id="desc">A luminous silver chromeheart integrated with symmetrical gothic filigree, sharp ornamental curves and dotted cybersigil geometry on a black background.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#171b1a"/><stop offset=".52" stop-color="#090b0b"/><stop offset="1" stop-color="#020303"/></radialGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".17" stop-color="#75817d"/><stop offset=".34" stop-color="#f7fffb"/><stop offset=".52" stop-color="#58625f"/><stop offset=".72" stop-color="#edf4f0"/><stop offset="1" stop-color="#697570"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fffb"/><stop offset="1" stop-color="#65716c"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="haze" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
 <style>
 .filigree{fill:none;stroke:url(#chrome);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
 .hair{fill:none;stroke:#d9e4de;stroke-opacity:.55;stroke-width:1}
 .dotted{fill:none;stroke:#dce8e1;stroke-width:2;stroke-linecap:round;stroke-dasharray:.1 11;opacity:.8}
 .heart{fill:#090d0b;stroke:url(#chrome);stroke-width:4;stroke-linejoin:round}
 .shine{fill:none;stroke:#fff;stroke-opacity:.82;stroke-width:1.15}
 .orbit{transform-origin:600px 270px;animation:orbit 32s linear infinite}
 .beat{transform-origin:600px 270px;animation:beat 5s ease-in-out infinite}
 .shimmer{animation:shimmer 4.5s ease-in-out infinite}
 .drift{animation:drift 7s ease-in-out infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
 @keyframes shimmer{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 </style>
</defs>
<rect width="1200" height="560" fill="url(#bg)"/>
<ellipse cx="600" cy="270" rx="270" ry="190" fill="#dbe8e0" opacity=".07" filter="url(#haze)"/>
<!-- outer dotted geometry -->
<g class="orbit">
 <ellipse class="dotted" cx="600" cy="270" rx="420" ry="190"/>
 <ellipse class="dotted" cx="600" cy="270" rx="360" ry="235" transform="rotate(45 600 270)"/>
 <ellipse class="hair" cx="600" cy="270" rx="450" ry="210"/>
 <path class="hair" d="M600 34C760 125 845 184 900 270C845 356 760 415 600 506C440 415 355 356 300 270C355 184 440 125 600 34Z"/>
</g>
<!-- sharp outer ornaments -->
<g class="filigree">
 <path d="M600 44C570 88 572 120 600 151C628 120 630 88 600 44Z"/>
 <path d="M600 496C570 452 572 420 600 389C628 420 630 452 600 496Z"/>
 <path d="M286 270C330 240 362 242 394 270C362 298 330 300 286 270Z"/>
 <path d="M914 270C870 240 838 242 806 270C838 298 870 300 914 270Z"/>
 <path d="M390 110Q450 112 476 174Q425 159 390 110ZM810 110Q750 112 724 174Q775 159 810 110Z"/>
 <path d="M390 430Q450 428 476 366Q425 381 390 430ZM810 430Q750 428 724 366Q775 381 810 430Z"/>
 <path d="M490 85Q540 112 548 174Q505 151 490 85ZM710 85Q660 112 652 174Q695 151 710 85Z"/>
 <path d="M490 455Q540 428 548 366Q505 389 490 455ZM710 455Q660 428 652 366Q695 389 710 455Z"/>
</g>
<!-- fine ornamental scrolls, mirrored -->
<g class="hair">
 <path d="M600 68C550 118 500 112 478 158C457 202 496 212 518 185C540 158 509 137 489 156"/>
 <path d="M600 68C650 118 700 112 722 158C743 202 704 212 682 185C660 158 691 137 711 156"/>
 <path d="M600 472C550 422 500 428 478 382C457 338 496 328 518 355C540 382 509 403 489 384"/>
 <path d="M600 472C650 422 700 428 722 382C743 338 704 328 682 355C660 382 691 403 711 384"/>
 <path d="M315 270Q400 202 474 242Q512 270 474 298Q400 338 315 270Z"/>
 <path d="M885 270Q800 202 726 242Q688 270 726 298Q800 338 885 270Z"/>
</g>
<!-- central chromeheart -->
<g class="beat">
 <path d="M600 365C557 330 456 267 456 197C456 132 530 104 600 174C670 104 744 132 744 197C744 267 643 330 600 365Z" fill="#dce8e1" opacity=".13" filter="url(#haze)"/>
 <path class="heart" d="M600 352C559 318 470 261 470 200C470 144 532 119 600 184C668 119 730 144 730 200C730 261 641 318 600 352Z" filter="url(#glow)"/>
 <path d="M600 331C565 302 489 251 489 202C489 160 540 141 600 200C660 141 711 160 711 202C711 251 635 302 600 331Z" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
 <path class="shine" d="M600 184C574 160 544 151 523 165M600 184C626 160 656 151 677 165"/>
 <path class="filigree" d="M600 352C578 326 576 300 600 279C624 300 622 326 600 352Z"/>
 <path class="hair" d="M600 279C566 247 546 224 550 195M600 279C634 247 654 224 650 195"/>
 <path class="filigree" d="M470 200Q440 182 424 202Q449 211 470 200M730 200Q760 182 776 202Q751 211 730 200"/>
 <circle cx="600" cy="264" r="5" fill="#fff" filter="url(#glow)"/>
</g>
<!-- ornamental chrome thorns / filigree around heart -->
<g class="filigree">
 <path d="M470 200Q420 172 405 125Q450 144 476 174"/>
 <path d="M730 200Q780 172 795 125Q750 144 724 174"/>
 <path d="M480 286Q438 314 424 361Q465 345 500 313"/>
 <path d="M720 286Q762 314 776 361Q735 345 700 313"/>
 <path d="M545 143Q520 111 535 83Q558 106 558 130M655 143Q680 111 665 83Q642 106 642 130"/>
 <path d="M545 397Q520 429 535 457Q558 434 558 410M655 397Q680 429 665 457Q642 434 642 410"/>
</g>
<!-- small diamond-like glints, not religious iconography -->
<g class="shimmer" fill="#fff" filter="url(#glow)">
 <path d="M600 82l3 10 10 3-10 3-3 10-3-10-10-3 10-3Z"/>
 <path d="M600 445l3 10 10 3-10 3-3 10-3-10-10-3 10-3Z"/>
 <path d="M365 270l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
 <path d="M835 270l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
</g>
<g fill="#d7e2dc" font-family="monospace" text-anchor="middle">
 <text x="600" y="525" font-size="17" letter-spacing="12">L X S H X Y A</text>
 <text x="600" y="545" font-size="9" letter-spacing="5" opacity=".72">BUILT IN THE DARK</text>
</g>
</svg>