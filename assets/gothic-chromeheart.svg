<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Gothic chromeheart sigil</title><desc id="desc">A symmetrical ornamental chrome heart with fine gothic filigree on a near-black field.</desc>
