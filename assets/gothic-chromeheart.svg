 <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fff9"/><stop offset=".18" stop-color="#788b82"/><stop offset=".36" stop-color="#e6f4ec"/><stop offset=".52" stop-color="#52645c"/><stop offset=".72" stop-color="#dce9e1"/><stop offset="1" stop-color="#718078"/></linearGradient>
