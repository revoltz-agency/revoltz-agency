<title id="title">Pablo Escobar text-symbol portrait study</title>
<desc id="desc">A portrait rendered from the supplied reference as rows of typewriter symbols, revealed line by line inside a vintage olive dossier. Abstract firearm silhouettes and stylized comic-book flash bursts are decorative fictional motifs.</desc>
